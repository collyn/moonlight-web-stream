<!DOCTYPE html>
<html lang="en" class="stream notranslate">

<head>
    <meta charset="UTF-8" />
    <meta name="google" content="notranslate" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widgets=overlays-content" />
    <title>Stream</title>
    <link rel="icon" href="resources/moonlight.svg" sizes="any" type="image/svg+xml">

    <link rel="stylesheet" href="styles/standard.css" id="style">
    <script>
        try {
            var s = JSON.parse(localStorage.getItem("mlSettings"));
            var t = s && s.pageStyle;
            if (t === "old") t = "moonlight";
            if (t && t !== "standard") {
                document.getElementById("style").href = "styles/" + t + ".css";
            }
        } catch(e) {}
    </script>
    <script type="module" src="styles/index.js"></script>

    <script type="module" src="stream.js" defer></script>

    <script>
        try {
            const raw = localStorage.getItem("mlSettings");
            const parsed = raw ? JSON.parse(raw) : null;
            const language = parsed && (parsed.language === "zh-CN" || parsed.language === "zh" || parsed.language === "zh_CN")
                ? "zh-CN"
                : "en";
            document.documentElement.lang = language;
            document.documentElement.translate = false;
            document.documentElement.classList.add("notranslate");
        } catch (_err) { }
    </script>
    <script>
        // Lock the viewport height so iOS keyboard doesn't shrink the layout.
        // Capture the initial full viewport height before any keyboard can change it.
        (function() {
            var ih = window.innerHeight;
            document.documentElement.style.setProperty('--vh-initial', ih + 'px');

            // When the visual viewport resizes (keyboard open/close), keep the page at
            // original height and prevent scroll offset caused by keyboard focus.
            if (window.visualViewport) {
                window.visualViewport.addEventListener('resize', function() {
                    window.scrollTo(0, 0);
                });
                window.visualViewport.addEventListener('scroll', function() {
                    window.scrollTo(0, 0);
                });
            }
        })();
    </script>
</head>

<body class="stream">
    <!-- Modal -->
    <div id="modal-overlay" class="modal-background modal-disabled">
        <!-- Modal Content -->
        <div id="modal-parent" class="modal-content">
        </div>
    </div>

    <!-- Sidebar -->
    <div class="sidebar-overlay prevent-start-transition" id="sidebar-root">
        <div class="sidebar-background prevent-start-transition">
            <button id="sidebar-button" class="sidebar-button"><img src="resources/arrow_left.svg"
                    class="sidebar-button-image prevent-start-transition" /></button>
            <div id="sidebar-parent" class="sidebar-content">
            </div>
        </div>
    </div>

    <!-- Errors -->
    <div id="error-list">
    </div>

    <!-- A dummy element for capturing inputs -->
    <div id="input" tabindex="0"></div>

    <!-- Main App View -->
    <div id="root">
    </div>

</body>

</html>
